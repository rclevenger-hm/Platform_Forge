name: Validate Platform Forge
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Report browser failure context
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('test-results').rglob('error-context.md'):
              print(path)
              print(path.read_text()[:14000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: test-results
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Verify served application
        run: |
          curl --fail http://127.0.0.1:8080/ | grep -q 'Platform Forge'
          curl --fail http://127.0.0.1:8080/api/health
      - name: Exercise isolated runner on disposable CI host
        run: |
          docker pull python:3.13-alpine
          docker build --target bash-lab -t platform-forge-bash:0.2 .
          python3 scripts/check_runner.py
      - if: always()
        run: docker compose down --volumes
