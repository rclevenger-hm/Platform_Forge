name: Import original implementation history
on:
  push:
    paths: [.bootstrap/history.bundle.b64]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and merge original history
        run: |
          base64 --decode .bootstrap/history.bundle.b64 > /tmp/platform-forge.bundle
          sha256sum --check .bootstrap/history.sha256
          git bundle verify /tmp/platform-forge.bundle
          git fetch /tmp/platform-forge.bundle main:refs/remotes/implementation/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --allow-unrelated-histories refs/remotes/implementation/main -m 'chore: publish original documented implementation history'
          git push origin HEAD:main
