name: Publish standalone edition
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Check initial Pages setup
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/forge-pages-config.json; then
            python3 -c 'import json; p=json.load(open("/tmp/forge-pages-config.json")); print("Pages configuration:", json.dumps({k:p.get(k) for k in ("build_type", "status", "html_url", "source")}))'
            source_type=$(python3 -c 'import json; print(json.load(open("/tmp/forge-pages-config.json")).get("build_type", "unknown"))')
            if [ "$source_type" = "workflow" ]; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            else
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo "::warning::Pages source is '$source_type'. Select GitHub Actions in Settings → Pages."
              echo "Standalone build passed. Pages source is '$source_type'; choose GitHub Actions in Settings → Pages." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Could not read Pages configuration. See the API error above; verify Pages setup and workflow permissions.'
            echo 'Standalone build passed, but Pages configuration could not be read. See the API error in Check initial Pages setup.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    if: needs.build.outputs.enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy standalone site
        id: deployment
        uses: actions/deploy-pages@v4
